name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    # -----------------------------
    # Secrets Scanning
    # -----------------------------
    - name: Run Gitleaks (Secrets Scanning)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

    # -----------------------------
    # Python Setup
    # -----------------------------
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    # -----------------------------
    # Semgrep SAST
    # -----------------------------
    - name: Install Semgrep
      run: pip install semgrep

    - name: Run SAST (Semgrep)
      run: |
        mkdir -p security-reports
        semgrep --config security-tools/semgrep.yml app/ \
          --json > security-reports/semgrep-results.json

    # -----------------------------
    # Build Container
    # -----------------------------
    - name: Build Docker Image
      run: docker build -t insecure-app .

    # -----------------------------
    # Trivy Container Scan
    # -----------------------------
    - name: Run Container Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: insecure-app
        format: json
        output: security-reports/trivy-results.json
        severity: CRITICAL,HIGH
        exit-code: 1

    # -----------------------------
    # Upload Audit / SIEM Evidence
    # -----------------------------
    - name: Upload Security Scan Reports
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-reports
        path: security-reports/

    - name: Generate Audit Evidence
      run: |
        mkdir -p audit-evidence
        echo "Build ID: $GITHUB_RUN_ID" >> audit-evidence/build-log.txt
        echo "Commit SHA: $GITHUB_SHA" >> audit-evidence/build-log.txt
        echo "Repository: $GITHUB_REPOSITORY" >> audit-evidence/build-log.txt

    - name: Upload Audit Evidence
      uses: actions/upload-artifact@v3
      with:
        name: audit-evidence
        path: audit-evidence/
