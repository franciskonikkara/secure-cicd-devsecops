name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install SAST tool
      run: pip install semgrep

    - name: Run SAST (Semgrep)
      run: semgrep --config security-tools/semgrep.yml app/

    - name: Build Docker Image
      run: docker build -t insecure-app app/

    - name: Run Container Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: insecure-app
        severity: CRITICAL,HIGH
        exit-code: 1

    - name: Generate Audit Evidence
      run: |
        echo "Build ID: $GITHUB_RUN_ID" >> audit-evidence/build-log.txt
